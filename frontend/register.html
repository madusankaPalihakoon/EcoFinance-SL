<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Register - EcoFinance SL</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <!-- Icons -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>

    <style>
      body {
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial;
      }

      .card-box {
        width: 420px;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 30px;
        color: white;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }

      .form-control {
        background: rgba(255, 255, 255, 0.15);
        border: none;
        color: white;
      }

      .form-control::placeholder {
        color: #ddd;
      }

      .input-group-text {
        background: rgba(255, 255, 255, 0.15);
        border: none;
        color: white;
      }

      .btn-register {
        background: #00c896;
        border: none;
      }

      .btn-register:hover {
        background: #00a87a;
      }

      .msg {
        font-size: 14px;
        margin-top: 10px;
      }
    </style>
  </head>

    <body>
        <div class="card-box">
        <h3 class="text-center mb-4">
            <i class="fa-solid fa-user-plus"></i> Register
        </h3>

        <!-- Full Name -->
        <div class="mb-3">

            <label>Full Name</label>

            <div class="input-group">
              <span class="input-group-text"><i class="fa fa-user"></i></span>
              <input type="text" id="full_name" class="form-control" placeholder="Enter full name" />
            </div>

        </div>

        <!-- Email -->
        <div class="mb-3">

            <label>Email</label>

            <div class="input-group">
              <span class="input-group-text"><i class="fa fa-envelope"></i></span>
              <input type="email" id="email" class="form-control" placeholder="Enter email" />
            </div>

        </div>

        <!-- Password -->
        <div class="mb-3">
            
          <label>Password</label>
            
          <div class="input-group">
            <span class="input-group-text"><i class="fa fa-lock"></i></span>
            <input type="password" id="password" class="form-control" placeholder="Enter password" />
          </div>

        </div>

        <!-- Confirm Password -->
        <div class="mb-3">

            <label>Confirm Password</label>

            <div class="input-group">
            
              <span class="input-group-text"><i class="fa fa-check"></i></span>
              <input type="password" id="confirm_password" class="form-control" placeholder="Confirm password" />
            </div>

        </div>

        <!-- Button -->
        <button class="btn btn-register w-100" onclick="register()"> Create Account </button>

        <p id="msg" class="text-center msg"></p>

        <p class="text-center mt-3"> Already have an account? <a href="login.html" style="color: #00ffcc">Login</a> </p>
        </div>

        <script>
        async function register() {
            let res = await fetch("http://127.0.0.1:5000/api/auth/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                full_name: document.getElementById("full_name").value,
                email: document.getElementById("email").value,
                password: document.getElementById("password").value,
                confirm_password: document.getElementById("confirm_password").value,
            }),
            });

            let data = await res.json();

            let msg = document.getElementById("msg");
            msg.innerText = data.message;

            if (data.success) {
            msg.style.color = "#00ffcc";

            setTimeout(() => {
                window.location.href = "login.html";
            }, 1000);
            } else {
            msg.style.color = "#ff6b6b";
            }
        }
        </script>
        <script src="js/auth.js"></script>
    </body>
</html>
