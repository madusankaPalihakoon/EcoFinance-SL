<!doctype html>

<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Login - EcoFinance SL</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial;
        }

        .card-box {
            width: 420px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 0 0 0.2rem rgba(0, 200, 150, 0.25);
        }

        .form-control::placeholder {
            color: #ddd;
        }

        .input-group-text {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
        }

        .btn-login {
            background: #00c896;
            border: none;
            color: white;
        }

        .btn-login:hover {
            background: #00a87a;
            color: white;
        }

        .msg {
            font-size: 14px;
            margin-top: 10px;
        }

        a {
            color: #00ffcc;
            text-decoration: none;
        }

        a:hover {
            color: #00c896;
            text-decoration: underline;
        }
    </style>
    

</head>

<body>
    <div class="card-box">

        
        <!-- Title -->
        <h3 class="text-center mb-4">
            <i class="fa-solid fa-right-to-bracket"></i> Login
        </h3>

        <!-- Email -->
        <div class="mb-3">
            <label>Email</label>

            <div class="input-group">
                <span class="input-group-text">
                    <i class="fa fa-envelope"></i>
                </span>

                <input type="email" id="email" class="form-control" placeholder="Enter email" />
            </div>
        </div>

        <!-- Password -->
        <div class="mb-3">
            <label>Password</label>

            <div class="input-group">
                <span class="input-group-text">
                    <i class="fa fa-lock"></i>
                </span>

                <input type="password" id="password" class="form-control" placeholder="Enter password" />
            </div>
        </div>

        <!-- Remember / Forgot -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <input type="checkbox" id="remember" class="form-check-input" />
                <label for="remember" class="ms-1">
                    Remember me
                </label>
            </div>

            <a href="forgot-password.html">
                Forgot Password?
            </a>
        </div>

        <!-- Login Button -->
        <button class="btn btn-login w-100" onclick="login()">
            <i class="fa-solid fa-right-to-bracket"></i>
            Login
        </button>

        <!-- Message -->
        <p id="msg" class="text-center msg"></p>

        <!-- Register -->
        <p class="text-center mt-3">
            Don't have an account?
            <a href="register.html">
                Register
            </a>
        </p>

    </div>

    <script>
        async function login() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            const msg = document.getElementById("msg");

            if (!email || !password) {
                msg.innerText = "Please enter email and password.";
                msg.style.color = "#ff6b6b";
                return;
            }

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                    }),
                });

                const data = await res.json();

                console.log(data);

                msg.innerText = data.message;

                if (data.success) {
                    msg.style.color = "#00ffcc";

                    // Store authentication token if returned by API
                    if (data.token) {
                        localStorage.setItem(
                            "token",
                            data.token
                        );
                    }

                    setTimeout(() => {
                        window.location.href = "dashboard/dashboard.html";
                    }, 500);
                } else {
                    msg.style.color = "#ff6b6b";
                }

            } catch (error) {
                console.error(error);

                msg.innerText =
                    "Unable to connect to the server.";

                msg.style.color = "#ff6b6b";
            }
        }

        // Allow pressing Enter to login
        document.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                login();
            }
        });
    </script>

    <script src="js/auth.js"></script>
    ```

</body>

</html>
