<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Report History</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="../../assets/css/common.css" />

    <link rel="stylesheet" href="reports.css" />
  </head>

  <body class="bg-gray-100">
    <div class="flex min-h-screen">
      <div id="sidebar"></div>

      <div class="flex-1">
        <div id="header"></div>

        <main class="p-8">
          <div class="flex justify-between items-center mb-6">
            <div>
              <h1 class="text-3xl font-bold">Report History</h1>

              <p class="text-gray-500">
                View and download generated sustainability reports.
              </p>
            </div>

            <a href="generate.html" class="btn-primary"> + Generate Report </a>
          </div>

          <div class="card">
            <div class="overflow-x-auto">
              <table class="w-full">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Title</th>
                    <th>Type</th>
                    <th>Status</th>
                    <th class="text-center">Actions</th>
                  </tr>
                </thead>

                <tbody id="reportTable"></tbody>
              </table>
            </div>
          </div>
        </main>

        <div id="footer"></div>
      </div>
    </div>

    <!-- Report Preview -->

    <div
      id="reportModal"
      class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50"
    >
      <div
        class="bg-white rounded-xl w-11/12 max-w-5xl max-h-[90vh] flex flex-col"
      >
        <div class="flex justify-between items-center border-b p-5">
          <h2 class="text-2xl font-bold">Sustainability Report</h2>

          <button id="closeModal" class="text-2xl">×</button>
        </div>

        <div class="overflow-auto p-6">
          <pre id="reportContent" class="report-preview"></pre>
        </div>
      </div>
    </div>

    <script type="module" src="history.js"></script>
  </body>
</html>
