services:

  test-db:
    image: mariadb:10.11

    container_name: ecofinance-test-db

    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: ${TEST_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${TEST_DB_NAME}
      MARIADB_USER: ${TEST_DB_USER}
      MARIADB_PASSWORD: ${TEST_DB_PASSWORD}

    volumes:
      - test_db_data:/var/lib/mysql
      - ./database/ecofinance_sl.sql:/docker-entrypoint-initdb.d/ecofinance_sl.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - ecofinance-test


  test-backend:
    build:
      context: ./backend

    container_name: ecofinance-test-backend

    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      DB_HOST: test-db
      DB_PORT: 3306
      DB_NAME: ${TEST_DB_NAME}
      DB_USER: ${TEST_DB_USER}
      DB_PASSWORD: ${TEST_DB_PASSWORD}

      SECRET_KEY: ${TEST_SECRET_KEY}
      JWT_SECRET_KEY: ${TEST_JWT_SECRET_KEY}

    depends_on:
      test-db:
        condition: service_healthy

    expose:
      - "5000"

    networks:
      - ecofinance-test


  test-frontend:
    image: nginx:alpine

    container_name: ecofinance-test-frontend

    restart: unless-stopped

    volumes:
      - ./frontend-test:/usr/share/nginx/html:ro

    expose:
      - "80"

    networks:
      - ecofinance-test


networks:

  ecofinance-test:
    external: true


volumes:

  test_db_data: