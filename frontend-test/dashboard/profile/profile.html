<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profile | EcoFinance SL</title>


    <!-- =========================================
         TAILWIND CSS
    ========================================== -->

    <script src="https://cdn.tailwindcss.com"></script>


    <!-- =========================================
         FONT AWESOME
    ========================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- =========================================
         COMMON CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="/assets/css/common.css"
    >


    <!-- =========================================
         PROFILE CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="/dashboard/profile/profile.css"
    >

</head>


<body class="bg-slate-100">


    <!-- =========================================
         MAIN APPLICATION LAYOUT
    ========================================== -->

    <div class="flex min-h-screen">


        <!-- =====================================
             SIDEBAR
        ====================================== -->

        <div id="sidebar"></div>



        <!-- =====================================
             RIGHT SIDE
        ====================================== -->

        <div
            class="flex-1 flex flex-col min-w-0 ml-64"
        >


            <!-- =================================
                 HEADER
            ================================== -->

            <div id="header"></div>



            <!-- =================================
                 MAIN CONTENT
            ================================== -->

            <main
                class="flex-1 overflow-auto p-8"
            >


                <!-- =================================
                     PAGE HEADING
                ================================== -->

                <div class="mb-8">

                    <div
                        class="flex items-center gap-3 mb-2"
                    >

                        <div
                            class="w-11 h-11 rounded-xl
                                   bg-green-100
                                   flex items-center
                                   justify-center"
                        >

                            <i
                                class="fa-solid fa-user
                                       text-green-600
                                       text-xl"
                            ></i>

                        </div>


                        <h1
                            class="text-3xl font-bold
                                   text-slate-900"
                        >
                            Profile Details
                        </h1>

                    </div>


                    <p
                        class="text-slate-500"
                    >
                        Manage your personal information
                        and account settings.
                    </p>

                </div>



                <!-- =================================
                     PROFILE CONTENT
                ================================== -->

                <div
                    class="grid grid-cols-1
                           lg:grid-cols-3
                           gap-6"
                >


                    <!-- =================================
                         PROFILE CARD
                    ================================== -->

                    <div class="card">


                        <!-- Profile Header -->

                        <div
                            class="flex flex-col
                                   items-center
                                   text-center"
                        >


                            <!-- Avatar -->

                            <div
                                id="avatar"
                                class="w-24 h-24
                                       rounded-full
                                       bg-green-600
                                       text-white
                                       flex items-center
                                       justify-center
                                       text-4xl
                                       font-bold
                                       mb-4"
                            >
                                U
                            </div>



                            <!-- User Full Name -->

                            <h2
                                id="profileName"
                                class="text-xl
                                       font-bold
                                       text-slate-900"
                            >
                                User
                            </h2>



                            <!-- Company Name -->

                            <p
                                id="profileRole"
                                class="text-slate-500
                                       mt-1
                                       break-words"
                            >
                                Company Name
                            </p>

                        </div>



                        <!-- =================================
                             COMPANY INFORMATION
                        ================================== -->

                        <div
                            class="mt-8
                                   border-t
                                   border-slate-200
                                   pt-6"
                        >


                            <!-- Section Title -->

                            <div
                                class="flex
                                       items-center
                                       gap-3
                                       mb-5"
                            >

                                <i
                                    class="fa-solid
                                           fa-building
                                           text-green-600"
                                ></i>


                                <span
                                    class="font-semibold
                                           text-slate-700"
                                >
                                    Company Information
                                </span>

                            </div>



                            <!-- Company Name -->

                            <div>

                                <p
                                    class="text-xs
                                           text-slate-400
                                           mb-1"
                                >
                                    Company Name
                                </p>


                                <p
                                    id="profileCompanyName"
                                    class="font-medium
                                           text-slate-700
                                           break-words"
                                >
                                    -
                                </p>

                            </div>

                        </div>

                    </div>



                    <!-- =================================
                         PERSONAL INFORMATION
                    ================================== -->

                    <div
                        class="card
                               lg:col-span-2"
                    >


                        <!-- Section Title -->

                        <h2
                            class="section-title"
                        >

                            <i
                                class="fa-solid
                                       fa-user
                                       mr-2
                                       text-green-600"
                            ></i>

                            Personal Information

                        </h2>



                        <!-- Form -->

                        <div
                            class="grid
                                   grid-cols-1
                                   md:grid-cols-2
                                   gap-6"
                        >


                            <!-- =================================
                                 FULL NAME
                            ================================== -->

                            <div>

                                <label
                                    for="fullName"
                                    class="form-label"
                                >
                                    Full Name
                                </label>


                                <input
                                    type="text"
                                    id="fullName"
                                    class="input"
                                    placeholder="Enter your full name"
                                >

                            </div>



                            <!-- =================================
                                 COMPANY NAME
                            ================================== -->

                            <div>

                                <label
                                    for="companyName"
                                    class="form-label"
                                >
                                    Company Name
                                </label>


                                <input
                                    type="text"
                                    id="companyName"
                                    class="input"
                                    placeholder="Company name"
                                    disabled
                                >

                            </div>



                            <!-- =================================
                                 EMAIL
                            ================================== -->

                            <div>

                                <label
                                    for="email"
                                    class="form-label"
                                >
                                    Email
                                </label>


                                <input
                                    type="email"
                                    id="email"
                                    class="input"
                                    placeholder="Email address"
                                >

                            </div>



                            <!-- =================================
                                 LANGUAGE
                            ================================== -->

                            <div>

                                <label
                                    for="language"
                                    class="form-label"
                                >
                                    Language
                                </label>


                                <select
                                    id="language"
                                    class="input"
                                >

                                    <option value="en">
                                        English
                                    </option>

                                    <option value="si">
                                        Sinhala
                                    </option>

                                </select>

                            </div>



                            <!-- =================================
                                 THEME
                            ================================== -->

                            <div>

                                <label
                                    for="theme"
                                    class="form-label"
                                >
                                    Theme
                                </label>


                                <select
                                    id="theme"
                                    class="input"
                                >

                                    <option value="light">
                                        Light
                                    </option>

                                    <option value="dark">
                                        Dark
                                    </option>

                                </select>

                            </div>

                        </div>



                        <!-- =================================
                             UPDATE PROFILE BUTTON
                        ================================== -->

                        <div
                            class="mt-8
                                   flex
                                   justify-end"
                        >

                            <button
                                type="button"
                                id="updateProfileBtn"
                                class="btn-primary"
                            >

                                <i
                                    class="fa-solid
                                           fa-floppy-disk
                                           mr-2"
                                ></i>

                                Update Profile

                            </button>

                        </div>

                    </div>



                    <!-- =================================
                         CHANGE PASSWORD
                    ================================== -->

                    <div
                        class="card
                               lg:col-span-3"
                    >


                        <!-- Section Title -->

                        <h2
                            class="section-title"
                        >

                            <i
                                class="fa-solid
                                       fa-lock
                                       mr-2
                                       text-green-600"
                            ></i>

                            Change Password

                        </h2>



                        <!-- Password Fields -->

                        <div
                            class="grid
                                   grid-cols-1
                                   md:grid-cols-3
                                   gap-6"
                        >


                            <!-- =================================
                                 CURRENT PASSWORD
                            ================================== -->

                            <div>

                                <label
                                    for="currentPassword"
                                    class="form-label"
                                >
                                    Current Password
                                </label>


                                <input
                                    type="password"
                                    id="currentPassword"
                                    class="input"
                                    placeholder="Current password"
                                >

                            </div>



                            <!-- =================================
                                 NEW PASSWORD
                            ================================== -->

                            <div>

                                <label
                                    for="newPassword"
                                    class="form-label"
                                >
                                    New Password
                                </label>


                                <input
                                    type="password"
                                    id="newPassword"
                                    class="input"
                                    placeholder="New password"
                                >

                            </div>



                            <!-- =================================
                                 CONFIRM PASSWORD
                            ================================== -->

                            <div>

                                <label
                                    for="confirmPassword"
                                    class="form-label"
                                >
                                    Confirm Password
                                </label>


                                <input
                                    type="password"
                                    id="confirmPassword"
                                    class="input"
                                    placeholder="Confirm new password"
                                >

                            </div>

                        </div>



                        <!-- =================================
                             CHANGE PASSWORD BUTTON
                        ================================== -->

                        <div
                            class="mt-8
                                   flex
                                   justify-end"
                        >

                            <button
                                type="button"
                                id="changePasswordBtn"
                                class="btn-primary"
                            >

                                <i
                                    class="fa-solid
                                           fa-key
                                           mr-2"
                                ></i>

                                Change Password

                            </button>

                        </div>

                    </div>

                </div>

            </main>



            <!-- =================================
                 FOOTER
            ================================== -->

            <div id="footer"></div>

        </div>

    </div>



    <!-- =========================================
         PROFILE JAVASCRIPT
    ========================================== -->

    <script
        type="module"
        src="/dashboard/profile/profile.js"
    ></script>


</body>

</html>
