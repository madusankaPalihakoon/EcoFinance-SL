<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Company | EcoFinance SL</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <!-- Common CSS -->
  <link rel="stylesheet" href="/assets/css/common.css">

  <!-- Company CSS -->
  <link rel="stylesheet" href="/dashboard/company/company.css">
</head>

<body class="bg-slate-100">

  <div class="flex min-h-screen">

    <!-- Sidebar -->
    <div id="sidebar"></div>

    <!-- Main Area -->
    <div class="flex-1 flex flex-col min-w-0">

      <!-- Header -->
      <div id="header"></div>

      <!-- Content -->
      <main class="flex-1 overflow-auto p-8">

        <div class="max-w-full">

          <!-- Company Information -->
          <div class="card">

            <div class="mb-8">
              <h1 class="text-2xl font-bold text-slate-900">
                Company Information
              </h1>

              <p class="text-slate-500 mt-1">
                Manage your company profile and business information
              </p>
            </div>

            <form id="companyForm">

              <!-- Basic Information -->
              <div class="mb-8">

                <h2 class="section-title">
                  Basic Information
                </h2>

                <div class="grid md:grid-cols-2 gap-6">

                  <div>
                    <label for="company_name" class="form-label">
                      Company Name
                    </label>

                    <input id="company_name" name="company_name" type="text" class="input"
                      placeholder="Enter company name">
                  </div>


                  <div>
                    <label for="registration_no" class="form-label">
                      Registration Number
                    </label>

                    <input id="registration_no" name="registration_no" type="text" class="input"
                      placeholder="Enter registration number">
                  </div>


                  <div>
                    <label for="business_sector" class="form-label">
                      Business Sector
                    </label>

                    <input id="business_sector" name="business_sector" type="text" class="input"
                      placeholder="Enter business sector">
                  </div>


                  <div>
                    <label for="website" class="form-label">
                      Website
                    </label>

                    <input id="website" name="website" type="url" class="input" placeholder="https://example.com">
                  </div>

                </div>

              </div>


              <!-- Location -->
              <div class="mb-8">

                <h2 class="section-title">
                  Location
                </h2>

                <div class="space-y-6">

                  <div>
                    <label for="address" class="form-label">
                      Address
                    </label>

                    <textarea id="address" name="address" rows="4" class="input"
                      placeholder="Enter company address"></textarea>
                  </div>


                  <div class="grid md:grid-cols-2 gap-6">

                    <div>
                      <label for="province" class="form-label">
                        Province
                      </label>

                      <select id="province" name="province" class="input">
                        <option value="">
                          Select Province
                        </option>
                      </select>
                    </div>


                    <div>
                      <label for="district" class="form-label">
                        District
                      </label>

                      <select id="district" name="district" class="input">
                        <option value="">
                          Select District
                        </option>
                      </select>
                    </div>

                  </div>

                </div>

              </div>


              <!-- Contact -->
              <div class="mb-8">

                <h2 class="section-title">
                  Contact Information
                </h2>

                <div class="grid md:grid-cols-2 gap-6">

                  <div>
                    <label for="contact_no" class="form-label">
                      Contact Number
                    </label>

                    <input id="contact_no" name="contact_no" type="tel" class="input"
                      placeholder="Enter contact number">
                  </div>


                  <div>
                    <label for="email" class="form-label">
                      Email
                    </label>

                    <input id="email" name="email" type="email" class="input" disabled placeholder="Account email">
                  </div>

                </div>

              </div>


              <!-- Buttons -->
              <div class="flex justify-end gap-4 pt-6 border-t border-slate-200">

                <button type="button" id="cancelBtn" class="btn-secondary">
                  Cancel
                </button>


                <button type="submit" id="saveBtn" class="btn-primary">
                  <i class="fa-solid fa-floppy-disk mr-2"></i>

                  Save Company
                </button>

              </div>

            </form>

          </div>

        </div>

      </main>

    </div>

  </div>


  <script type="module">

    import { initLayout }
      from "/assets/js/layout.js";

    initLayout({
      title: "Company"
    });

  </script>

  <script type="module" src="/dashboard/company/company.js"></script>

</body>

</html>
